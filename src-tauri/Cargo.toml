[package]
name = "magic-tools"
version = "2.0.0"
description = "Developer Tools Application"
authors = ["bluefrog <bluefrog.wu@gmail.com>"]
edition = "2021"
license = "MIT"

# 参考: https://tauri.app/develop/
# tauri v2 项目结构:
#   src-tauri/src/main.rs    -> 入口
#   src-tauri/src/lib.rs     -> 应用逻辑
#   src-tauri/tauri.conf.json -> 配置
#   src/renderer             -> React 前端 (保持不变)
#   dist/                    -> React 打包产物 (tauri frontendDist)

[lib]
name = "magic_tools_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon"] }
tauri-plugin-opener = "2"
tauri-plugin-single-instance = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
log = "0.4"
