name: build-release

# 触发条件: 推送 v* 格式的 git tag (例如 v1.3.0)
# 用法: 更新 update.md 后执行 `just tag 1.3.1` 即可自动触发
on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          # Windows: 单体免安装 exe (依赖系统自带 WebView2)
          - platform: 'windows-latest'
            args: '--no-bundle'
          # macOS: 免安装 .app (打包为 zip)
          - platform: 'macos-latest'
            args: '--bundles app'
          # Linux: 免安装 AppImage
          - platform: 'ubuntu-22.04'
            args: '--bundles appimage'
    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v4

      - name: Install Linux dependencies
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            patchelf \
            libxdo-dev \
            libssl-dev

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - uses: dtolnay/rust-toolchain@stable

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: './src-tauri -> target'

      - name: Install frontend dependencies
        run: npm ci || npm install

      - name: Build with Tauri (${{ matrix.platform }})
        run: npm run tauri build -- ${{ matrix.args }}

      - name: Package macOS app as zip
        if: matrix.platform == 'macos-latest'
        run: |
          APP=$(find src-tauri/target/release/bundle/macos -maxdepth 1 -name '*.app' | head -n 1)
          echo "app bundle: $APP"
          ditto -c -k --keepParent "$APP" "MagicTools-macOS-aarch64.zip"
          ls -la MagicTools-macOS-aarch64.zip

      - name: Upload release assets
        uses: softprops/action-gh-release@v2
        with:
          # 发布说明: 取项目根目录 update.md 的内容
          body_path: update.md
          files: |
            src-tauri/target/release/*.exe
            MagicTools-macOS-aarch64.zip
            src-tauri/target/release/bundle/appimage/*.AppImage
