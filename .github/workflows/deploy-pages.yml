# 版本发布后部署纯前端版到 GitHub Pages
# 触发时机: 推送 v* 版本 tag (与 build-release.yml 同源) 或手动 workflow_dispatch
# 产物: 纯前端 Web 版 (Vite renderer 构建, dist/), base './' 适配仓库子路径
name: deploy-pages

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: |
          npm ci --no-audit --no-fund --registry=https://registry.npmjs.org || {
            echo 'npm ci failed (lock drift / npm version strictness), falling back to npm install'; \
            npm install --no-audit --no-fund --registry=https://registry.npmjs.org; \
          }

      - name: Build renderer (纯前端版)
        run: npm run build:renderer

      # 站点布局: 根目录 = 三语官网 (docs/), 子路径 /tools/ = Web 版应用
      # https://freewu.github.io/magic-tools/         -> docs 官网
      # https://freewu.github.io/magic-tools/tools/   -> Web 版 (vite base './' + hash 路由, 子路径可直接访问)
      - name: Assemble site (docs at root, web app under /tools/)
        run: |
          mkdir -p _site/tools
          cp -R dist/. _site/tools/
          cp docs/index.html docs/zh-CN.html docs/zh-TW.html docs/logo.png _site/
          echo '--- assembled site ---'
          ls _site && echo '--- _site/tools ---' && ls _site/tools | head -10

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: _site

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
